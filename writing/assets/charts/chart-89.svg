<svg font-family="Arial,Helvetica,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" role="img" aria-labelledby="title desc">
 <title id="title">Northgate Park in 2000 and 2020</title>
 <desc id="desc">North is up. The orchard became a playground, the north-east lawn a café, and the shed bicycle stands. A south gate and café paths were added. The central pond, original west gate and south-east lawn remain.</desc>
